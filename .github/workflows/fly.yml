# Deploy the hosted AI proxy to Fly on pushes that change the server. Needs the repo secret FLY_API_TOKEN
# (fly tokens create deploy); without it the job is skipped.
name: Deploy proxy to Fly

on:
  push:
    branches: [main]
    paths: ['server.js', 'niche-server.js', 'proxy-guard.js', 'public/core/**', 'fly.toml', 'Dockerfile']
  workflow_dispatch:

concurrency:
  group: fly
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.FLY_API_TOKEN != ''
        with:
          node-version: 22
      - name: Proxy guardrail tests
        if: env.FLY_API_TOKEN != ''
        run: node --test test/proxy-guard.test.js
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
